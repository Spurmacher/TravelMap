<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVELMAP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#12150f;
    --bg-1:#191d13;
    --bg-2:#20251a;
    --line:#2f3626;
    --sand:#cbb389;
    --sand-dim:#8f8265;
    --text:#e8e3d3;
    --text-mute:#8b8b78;
    --lcd:#9ecb6a;
    --lcd-dim:#4f6b3a;
    --c-embassy:#cbb389;
    --c-camp:#7fae5c;
    --c-border:#d9973a;
    --c-logistik:#5f9fc4;
    --c-danger:#c1462f;
    --c-poi:#a884c4;
    --c-country:#c9c2a3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg-0);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    grid-template-rows:56px 1fr;
    height:100vh;
  }
  .topbar{
    grid-column:1/3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--bg-1);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.14em;
    color:var(--sand);
  }
  .brand .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-mute);
    letter-spacing:0.04em;
  }
  .stat{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-mute);
    letter-spacing:0.03em;
  }
  .stat b{color:var(--lcd);font-weight:500;}

  .sidebar{
    background:var(--bg-1);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:16px 0 10px;
  }
  .side-section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--text-mute);
    padding:6px 18px;
    text-transform:uppercase;
  }
  .layer-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 18px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .12s;
  }
  .layer-row:hover{background:var(--bg-2);}
  .layer-row.active{border-left-color:var(--sand);}
  .swatch{
    width:11px;height:11px;border-radius:2px;flex:none;
  }
  .layer-name{
    flex:1;
    font-size:13px;
    color:var(--text);
  }
  .layer-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-mute);
  }
  .checkbox{
    width:14px;height:14px;
    border:1px solid var(--sand-dim);
    border-radius:3px;
    flex:none;
    position:relative;
  }
  .layer-row.on .checkbox{background:var(--sand);border-color:var(--sand);}
  .layer-row.on .checkbox::after{
    content:'';
    position:absolute;left:3px;top:0px;
    width:4px;height:8px;
    border:solid var(--bg-0);
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .caret{
    width:10px;height:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-mute);
    transition:transform .12s;
    font-size:9px;
  }
  .caret.open{transform:rotate(90deg);}
  .cat-row{padding-left:10px;}
  .cat-row .layer-name{font-weight:500;}
  .subcat-list{
    display:none;
    overflow:hidden;
  }
  .subcat-list.open{display:block;}
  .subcat-row{
    display:flex;align-items:center;gap:10px;
    padding:6px 18px 6px 40px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .12s;
  }
  .subcat-row:hover{background:var(--bg-2);}
  .subcat-row .layer-name{font-size:12px;color:var(--text-mute);}
  .subcat-row.on .layer-name{color:var(--text);}
  .subcat-row .checkbox{width:12px;height:12px;}
  .subcat-row.on .checkbox{background:var(--sand);border-color:var(--sand);}
  .subcat-row.on .checkbox::after{
    content:'';
    position:absolute;left:2px;top:-1px;
    width:4px;height:7px;
    border:solid var(--bg-0);
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .divider{height:1px;background:var(--line);margin:10px 0;}

  .readout{
    margin:10px 14px 4px;
    padding:12px 14px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'JetBrains Mono',monospace;
  }
  .readout .rlabel{
    font-size:9px;letter-spacing:0.12em;color:var(--text-mute);
    text-transform:uppercase;margin-bottom:6px;
  }
  .readout .rval{
    font-size:13px;color:var(--lcd);
    line-height:1.6;
  }
  .readout .rval .dim{color:var(--lcd-dim);}

  .btn{
    padding:8px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg-2); color:var(--text); font-size:11px; font-weight:600;
    font-family:'Space Grotesk',sans-serif; letter-spacing:0.03em;
    cursor:pointer;
  }
  .btn:hover{border-color:var(--sand-dim);}
  .btn:disabled{opacity:0.4; cursor:default;}
  .btn.small{padding:7px 8px; font-size:11px;}
  .btn.copied{background:var(--ok); color:#12150f; border-color:var(--ok);}

  .note{
    margin:14px 18px 0;
    font-size:11px;
    line-height:1.5;
    color:var(--text-mute);
  }

  .map-wrap{position:relative;}
  #map{height:100%;width:100%;background:var(--bg-0);}

  .elevation-panel{
    position:absolute;
    left:14px; right:14px; bottom:14px;
    background:rgba(18,21,15,0.94);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px 8px;
    display:none;
    z-index:1000;
  }
  .elevation-panel.open{display:block;}
  .elevation-head{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--text-mute); margin-bottom:4px;
  }
  #elevationClose{cursor:pointer; font-size:16px; line-height:1; padding:0 4px;}
  #elevationSvg{width:100%; height:70px; display:block;}
  .elevation-meta{
    display:flex; gap:16px;
    font-family:'JetBrains Mono',monospace; font-size:10px;
    color:var(--text-mute); margin-top:4px;
  }
  .elevation-meta b{color:var(--lcd); font-weight:500;}

  .leaflet-popup-content-wrapper{
    background:var(--bg-1);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
  }
  .leaflet-popup-tip{background:var(--bg-1);border:1px solid var(--line);}
  .leaflet-popup-content{margin:12px 14px;min-width:300px;}
  .pop-cat{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .pop-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:14px;
    margin-bottom:6px;
    color:var(--text);
  }
  .pop-note{font-size:12px;color:#c9c4b3;line-height:1.5;margin-bottom:6px;}
  .pop-gallery-wrap{position:relative; margin-bottom:8px;}
  .pop-gallery{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    border-radius:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .pop-gallery::-webkit-scrollbar{display:none;}
  .pop-gallery img{
    flex:0 0 100%; width:100%; height:190px; object-fit:cover;
    scroll-snap-align:start;
  }
  .gal-prev, .gal-next{
    position:absolute; top:50%; transform:translateY(-50%);
    width:24px; height:24px; border-radius:50%;
    background:rgba(18,21,15,0.7); color:var(--sand);
    border:none; font-size:14px; line-height:22px; text-align:center;
    cursor:pointer; padding:0;
  }
  .gal-prev{left:4px;}
  .gal-next{right:4px;}
  .gal-counter{
    position:absolute; right:6px; bottom:6px;
    background:rgba(18,21,15,0.75); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:10px;
    padding:2px 6px; border-radius:10px;
  }
  .pop-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--text-mute);
    display:flex;justify-content:space-between;
    border-top:1px solid var(--line);
    padding-top:6px;
  }
  .leaflet-control-zoom a{
    background:var(--bg-1) !important;
    color:var(--text) !important;
    border-color:var(--line) !important;
  }
  .leaflet-control-attribution{
    background:rgba(18,21,15,0.75) !important;
    color:var(--text-mute) !important;
  }
  .leaflet-control-attribution a{color:var(--sand-dim) !important;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--bg-1);}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  @media (max-width:720px){
    .app{grid-template-columns:1fr;grid-template-rows:56px 42vh 1fr;}
    .sidebar{grid-row:2;border-right:none;border-bottom:1px solid var(--line);}
    .map-wrap{grid-row:3;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="mark">TRAVELMAP</span>
      <a href="https://www.spurmacher.ch" target="_blank" class="sub" style="text-decoration:none;">SPURMACHER.ch</a>
    </div>
    <div class="stat">Data:<b id="pointCount">0</b> point visible</div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="side-section-label">Layer</div>
    <div id="layerList"></div>

    <div class="divider"></div>

    <div class="side-section-label">Tracks</div>
    <div id="trackList"></div>

    <div class="divider"></div>

    <div class="readout">
      <div class="rlabel">Letzte Auswahl</div>
      <div class="rval" id="coordReadout">
        LAT <span class="dim"> </span><br>
        LON <span class="dim"> </span><br>
        DAT <span class="dim"> </span>
      </div>
      <button class="btn small" id="btnCopyCoords" type="button" style="margin-top:8px;width:100%;" disabled>Copy Coordinates</button>
    </div>

    <p class="note">
      Data source: <a href="https://www.spurmacher.ch" target="_blank" style="color:var(--sand);">SPURMACHER.ch</a><br><br>
      This map grows with every journey we undertake, acting as a visual diary that captures our memories and shares them with the world.
    </p>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="elevation-panel" id="elevationPanel">
      <div class="elevation-head">
        <span id="elevationTitle"></span>
        <span id="elevationClose">&times;</span>
      </div>
      <svg id="elevationSvg" viewBox="0 0 600 100" preserveAspectRatio="none"></svg>
      <div class="elevation-meta" id="elevationMeta"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>
<script>document.write('<scr' + 'ipt src="data.js?v=' + Date.now() + '"></scr' + 'ipt>');</script>
<script>
// ---------------------------------------------------------------
// Struktur der Punkte entspricht dem Sheet-Schema (siehe data.js):
// kategorie, titel, lat, lon, datum, notiz
// Später: dieses Array durch fetch() auf den Apps-Script-Endpoint ersetzen.
// ---------------------------------------------------------------
const CATEGORIES = {
  "Accommodation": { hex:"#7fae5c" },
  "Checkpoints":   { hex:"#d9973a" },
  "Logistics":     { hex:"#5f9fc4" },
  "Danger":        { hex:"#c1462f" },
  "Sightseeing":   { hex:"#a884c4" },
  "Country Info":  { hex:"#c9c2a3" },
  "Embassy":       { hex:"#cbb389" },
  "Social":        { hex:"#e0b04a" },
};

// Muss inhaltlich zu ALLOWED_CATEGORIES in Code.gs / CATEGORIES in capture.html passen.
// Nur für die Sidebar-Filterliste nötig, keine Validierung hier.
const SUBCATEGORIES = {
  "Accommodation": ["Wild Camp", "Campsite", "Parking Lot", "Hotel", "Guesthouse", "Other"],
  "Checkpoints":   ["Border Crossing", "Police Checkpoint", "Military Checkpoint"],
  "Logistics":     ["Water", "Fuel", "SIM/Internet", "Car Insurance", "Shopping", "ATM & Exchange", "Workshop", "Spare Parts", "Laundry" ],
  "Danger":        ["Road Condition", "Safety Warning", "Avoid Area", "Natural Hazard", ],
  "Sightseeing":   ["Attraction", "Viewpoint", "Hike", "Beach", "Culture", "National Park", "Scenery" ],
  "Country Info":  ["General Information"],
  "Embassy":       ["General Information"],
  "Social":        ["Blog Entry", "Meetup"],
};

// Tabler-Icon-Name je Subcategory (ohne "ti-"-Praefix, wird beim Rendern ergaenzt).
// Marker-Kreisfarbe bleibt die Category-Farbe. Fallback: DEFAULT_ICON.
const DEFAULT_ICON = "map-pin";
const SUBCATEGORY_ICONS = {
  "Wild Camp": "tent", "Campsite": "campfire", "Parking Lot": "parking", "Hotel": "building", "Guesthouse": "home", "Other": "map-pin",
  "Border Crossing": "flag", "Police Checkpoint": "shield", "Military Checkpoint": "shield-lock",
  "Water": "droplet", "Fuel": "gas-station", "SIM/Internet": "wifi", "Car Insurance": "file-text", "Shopping": "shopping-cart",
  "ATM & Exchange": "cash-banknote", "Workshop": "tool", "Spare Parts": "settings", "Laundry": "wash",
  "Road Condition": "road", "Safety Warning": "alert-triangle", "Avoid Area": "ban", "Natural Hazard": "wind",
  "Attraction": "camera", "Viewpoint": "binoculars", "Hike": "mountain", "Beach": "umbrella",
  "Culture": "landmark", "National Park": "trees", "Scenery": "photo",
  "General Information": "info-circle",
  "Blog Entry": "notes", "Meetup": "users",
};

 
// DATA wird aus data.js geladen (siehe <script src="data.js"> weiter unten).
// data.js wird von sync-map.ps1 automatisch aus dem Google Sheet erzeugt und
// enthält ein Array von Punkten mit den Feldern:
// id, date, category, subcategory, title, note, lat, lon, photoUrl, infoUrl, country
// (exakt das JSON-Format, das doGet() in Code.gs liefert)
if (typeof DATA === 'undefined') {
  console.warn('data.js nicht gefunden oder leer, zeige Platzhalter-Punkt.');
  var DATA = [
    {id:"placeholder", category:"Country Info", subcategory:"Description", title:"Noch keine Daten synchronisiert",
     lat:31.6, lon:-7.9, date:"", note:"sync-map.ps1 einmal ausführen, um echte Punkte zu laden.", photoUrl:"", infoUrl:"", country:""}
  ];
}

// ---------------------------------------------------------------
// Karte initialisieren
// ---------------------------------------------------------------
const map = L.map('map', { zoomControl:true, attributionControl:true })
  .setView([24, -10], 4);

// Normale Karte:
// L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
//   maxZoom: 17,
//   attribution: 'Kartendaten: &copy; OpenStreetMap-Mitwirkende, SRTM | Darstellung: &copy; OpenTopoMap (CC-BY-SA)'
// }).addTo(map);


// Normale Karte:
// Esri World Street Map	Strassenkarten-Look, ähnlich Google-Maps-Optik
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Esri, HERE, Garmin, FAO, NOAA, USGS'
 }).addTo(map);
map.attributionControl.addAttribution('<a href="https://tabler.io/icons" target="_blank">Tabler Icons</a>');

// Esri World Street Map	Strassenkarten-Look, ähnlich Google-Maps-Optik

function makeIcon(hex, icon){
  return L.divIcon({
    className: '',
    html: `<div style="
      width:26px;height:26px;border-radius:50%;
      background:${hex};
      border:2px solid #12150f;
      box-shadow:0 0 0 1px ${hex}88;
      display:flex;align-items:center;justify-content:center;
    "><i class="ti ti-${icon || DEFAULT_ICON}" style="font-size:14px;color:#12150f;"></i></div>`,
    iconSize:[26,26],
    iconAnchor:[13,13],
    popupAnchor:[0,-13],
  });
}

// Gruppenschlüssel: "Category||Subcategory" 
// oder falls im Sheet mal keine Subcategory gesetzt ist).
function groupKey(cat, sub){ return cat + "||" + (sub || ""); }

const layerGroups = {};
const markersByKey = {};
Object.entries(SUBCATEGORIES).forEach(([cat, subs]) => {
  const keys = subs.length ? subs.map(s => groupKey(cat, s)) : [groupKey(cat, "")];
  keys.forEach(k => { layerGroups[k] = L.layerGroup(); markersByKey[k] = []; });
});

// Reagiert auf jedes geoeffnete Popup mit Mehrfach-Galerie: Pfeile + Zaehler verdrahten.
function wireGallery(e){
  const popupEl = e.popup.getElement ? e.popup.getElement() : null;
  if (!popupEl) return;
  const gallery = popupEl.querySelector('.pop-gallery');
  if (!gallery) return;
  const counter = popupEl.querySelector('.gal-counter');
  const total = gallery.children.length;

  function updateCounter(){
    const idx = Math.round(gallery.scrollLeft / gallery.clientWidth) + 1;
    if (counter) counter.textContent = Math.min(idx, total) + ' / ' + total;
  }
  gallery.addEventListener('scroll', updateCounter);

  const prevBtn = popupEl.querySelector('.gal-prev');
  const nextBtn = popupEl.querySelector('.gal-next');
  if (prevBtn) prevBtn.addEventListener('click', () => gallery.scrollBy({ left: -gallery.clientWidth, behavior: 'smooth' }));
  if (nextBtn) nextBtn.addEventListener('click', () => gallery.scrollBy({ left: gallery.clientWidth, behavior: 'smooth' }));
  updateCounter();
}

DATA.forEach(pt => {
  const cfg = CATEGORIES[pt.category];
  if (!cfg) { console.warn('Unbekannte Category, übersprungen:', pt.category, pt); return; }

  let key = groupKey(pt.category, pt.subcategory);
  if (!layerGroups[key]) {
    // Subcategory im Datensatz unbekannt/leer, aber Category gültig -> eigene
    // Sammelgruppe statt den Punkt stillschweigend zu verlieren.
    key = groupKey(pt.category, "");
    if (!layerGroups[key]) { layerGroups[key] = L.layerGroup(); markersByKey[key] = []; }
  }

  const marker = L.marker([pt.lat, pt.lon], { icon: makeIcon(cfg.hex, SUBCATEGORY_ICONS[pt.subcategory]) });
  const subLabel = pt.subcategory ? ` · ${pt.subcategory}` : '';

  // photoUrl kann mehrere, durch " | " getrennte URLs enthalten (mehrere Fotos pro Punkt)
  const photos = (pt.photoUrl || '').split('|').map(s => s.trim()).filter(Boolean);
  let photoHtml = '';
  if (photos.length === 1) {
    photoHtml = `<img src="${photos[0]}" style="width:100%;height:190px;object-fit:cover;border-radius:4px;margin-bottom:8px;">`;
  } else if (photos.length > 1) {
    photoHtml = `
      <div class="pop-gallery-wrap">
        <div class="pop-gallery">
          ${photos.map(u => `<img src="${u}">`).join('')}
        </div>
        <button class="gal-prev" type="button">&lsaquo;</button>
        <button class="gal-next" type="button">&rsaquo;</button>
        <div class="gal-counter">1 / ${photos.length}</div>
      </div>
    `;
  }

  const infoHtml = pt.infoUrl ? `<a href="${pt.infoUrl}" target="_blank" style="color:${cfg.hex};font-size:11px;">Mehr Infos â†’</a><br>` : '';
  const weatherHtml = (pt.temperature !== null && pt.temperature !== undefined && pt.temperature !== '')
    ? `<div class="pop-note" style="margin-bottom:2px;">${pt.weather || ''} ${Math.round(pt.temperature)}°C</div>`
    : '';

  marker.bindPopup(`
    <div class="pop-cat" style="color:${cfg.hex}">${pt.category}${subLabel}</div>
    <div class="pop-title">${pt.title}</div>
    ${photoHtml}
    <div class="pop-note">${pt.note || ''}</div>
    ${weatherHtml}
    ${infoHtml}
    <div class="pop-meta"><span>${pt.date || ''}${pt.time ? ' · ' + pt.time : ''}</span><span>${pt.lat.toFixed(4)}, ${pt.lon.toFixed(4)}</span></div>
  `);
  if (photos.length > 1) {
    marker.on('popupopen', wireGallery);
  }
  marker.on('click', () => updateReadout(pt, cfg));
  marker.addTo(layerGroups[key]);
  markersByKey[key].push(marker);
});


const activeGroups = new Set(Object.keys(layerGroups));
Object.values(layerGroups).forEach(g => g.addTo(map));

function updatePointCount(){
  let n = 0;
  activeGroups.forEach(k => n += (markersByKey[k] ? markersByKey[k].length : 0));
  document.getElementById('pointCount').textContent = n;
}

let lastLat = null, lastLon = null;

function updateReadout(pt, cfg){
  lastLat = pt.lat;
  lastLon = pt.lon;
  document.getElementById('coordReadout').innerHTML = `
    LAT <span style="color:${cfg.hex}">${pt.lat.toFixed(4)}</span><br>
    LON <span style="color:${cfg.hex}">${pt.lon.toFixed(4)}</span><br>
    DAT <span class="dim">${pt.date || '—'}${pt.time ? ' · ' + pt.time : ''}</span>
  `;
  const btn = document.getElementById('btnCopyCoords');
  btn.disabled = false;
  btn.textContent = 'Copy Coordinates';
  btn.classList.remove('copied');
}

document.getElementById('btnCopyCoords').addEventListener('click', async () => {
  if (lastLat === null || lastLon === null) return;
  const text = `${lastLat.toFixed(6)}, ${lastLon.toFixed(6)}`;
  const btn = document.getElementById('btnCopyCoords');
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Coordinates'; btn.classList.remove('copied'); }, 1500);
  } catch (err) {
    btn.textContent = 'Error while copying';
  }
});

// ---------------------------------------------------------------
// Sidebar: Category-Zeilen mit aufklappbaren Subcategory-Listen
// ---------------------------------------------------------------
function setGroupState(row, key, on){
  if (on) {
    map.addLayer(layerGroups[key]);
    activeGroups.add(key);
    row.classList.add('on','active');
  } else {
    map.removeLayer(layerGroups[key]);
    activeGroups.delete(key);
    row.classList.remove('on','active');
  }
}

const layerList = document.getElementById('layerList');

Object.entries(CATEGORIES).forEach(([cat, cfg]) => {
  const subs = SUBCATEGORIES[cat] || [];
  const catCount = subs.length
    ? subs.reduce((n, s) => n + (markersByKey[groupKey(cat, s)] || []).length, 0) + (markersByKey[groupKey(cat, "")] || []).length
    : (markersByKey[groupKey(cat, "")] || []).length;

  const catRow = document.createElement('div');
  catRow.className = 'layer-row cat-row on active';
  catRow.innerHTML = `
    <div class="caret${subs.length ? '' : ' hidden'}" style="${subs.length ? '' : 'visibility:hidden;'}">&#9656;</div>
    <div class="checkbox"></div>
    <div class="swatch" style="background:${cfg.hex}"></div>
    <div class="layer-name">${cat}</div>
    <div class="layer-count">${catCount}</div>
  `;

  // Subcategory-Container (nur falls vorhanden)
  let subList = null;
  const subRows = [];
  if (subs.length) {
    subList = document.createElement('div');
    subList.className = 'subcat-list';

    subs.forEach(sub => {
      const key = groupKey(cat, sub);
      if (!layerGroups[key]) return;
      const count = markersByKey[key].length;

      const subRow = document.createElement('div');
      subRow.className = 'subcat-row on';
      subRow.innerHTML = `
        <div class="checkbox"></div>
        <div class="layer-name">${sub}</div>
        <div class="layer-count">${count}</div>
      `;
      subRow.addEventListener('click', (e) => {
        e.stopPropagation();
        setGroupState(subRow, key, !activeGroups.has(key));
        updatePointCount();
      });
      subList.appendChild(subRow);
      subRows.push(subRow);
    });
  } else {
    // Category ohne Subcategories (z.B. Route) -> Category-Klick steuert direkt die einzige Gruppe
  }

  // Klick auf Category-Zeile: Caret klappt auf/zu, Checkbox/Name/Swatch togglen alles darunter
  catRow.addEventListener('click', (e) => {
    const caret = catRow.querySelector('.caret');
    const clickedCaret = e.target === caret;

    if (clickedCaret && subs.length) {
      caret.classList.toggle('open');
      subList.classList.toggle('open');
      return;
    }

    const turnOn = !catRow.classList.contains('on');
    if (subs.length) {
      subs.forEach(sub => {
        const key = groupKey(cat, sub);
        const idx = subs.indexOf(sub);
        if (layerGroups[key]) setGroupState(subRows[idx], key, turnOn);
      });
    } else {
      setGroupState(catRow, groupKey(cat, ""), turnOn);
    }
    if (turnOn) { catRow.classList.add('on','active'); } else { catRow.classList.remove('on','active'); }
    updatePointCount();
  });

  layerList.appendChild(catRow);
  if (subList) layerList.appendChild(subList);
});

updatePointCount();

// ---------------------------------------------------------------
// GPX-Tracks: unabhaengig vom Sheet/Sync, direkt aus dem Repo geladen.
// tracks/manifest.json listet die Dateien auf - neuer Track = neue
// Zeile dort, kein Anfassen von travelmap.html noetig.
// Beispiel manifest.json:
// [{"file":"2026-11-06.gpx","label":"Marokko Tag 1"}]
// ---------------------------------------------------------------
function stripAllMarkers(layer){
  if (!layer.eachLayer) return;
  const toRemove = [];
  layer.eachLayer(sub => {
    if (sub instanceof L.Marker) {
      toRemove.push(sub);
    } else if (sub.eachLayer) {
      stripAllMarkers(sub);
    }
  });
  toRemove.forEach(m => layer.removeLayer(m));
}

// Ersetzt die vom Plugin gezeichnete(n) Polyline(n) durch ein zweifarbiges
// "Casing": breitere Randlinie (borderColor) unten, schmalere Mittellinie
// (fillColor) oben drauf - klassischer Karten-Look fuer Routenlinien.
function makeTwoToneTrack(gpxLayer, fillColor, borderColor, weight){
  const polylines = [];
  gpxLayer.eachLayer(sub => {
    if (sub instanceof L.Polyline) polylines.push(sub);
  });
  polylines.forEach(poly => {
    const latlngs = poly.getLatLngs();
    gpxLayer.removeLayer(poly);
    L.polyline(latlngs, {
      color: borderColor, weight: weight + 6, opacity: 0.9,
      lineJoin: 'round', lineCap: 'round'
    }).addTo(gpxLayer);
    L.polyline(latlngs, {
      color: fillColor, weight: weight, opacity: 1,
      lineJoin: 'round', lineCap: 'round'
    }).addTo(gpxLayer);
  });
}

const trackList = document.getElementById('trackList');
const DEFAULT_TRACK_COLOR = "#e0862e";
const elevationPanel = document.getElementById('elevationPanel');
const elevationSvg = document.getElementById('elevationSvg');
const elevationTitle = document.getElementById('elevationTitle');
const elevationMeta = document.getElementById('elevationMeta');
document.getElementById('elevationClose').addEventListener('click', () => {
  elevationPanel.classList.remove('open');
});

function renderElevationChart(gpxLayer, label, color){
  const data = gpxLayer.get_elevation_data(); // [[distanceKm, elevationM], ...]
  if (!data || data.length < 2) {
    elevationSvg.innerHTML = '';
    elevationMeta.innerHTML = 'Keine Hoehendaten in dieser GPX-Datei.';
  } else {
    const elevs = data.map(p => p[1]);
    const minE = Math.min(...elevs), maxE = Math.max(...elevs);
    const distTotal = data[data.length - 1][0];
    const w = 600, h = 100, pad = 4;

    const points = data.map(p => {
      const x = (p[0] / distTotal) * w;
      const y = h - pad - ((p[1] - minE) / (maxE - minE || 1)) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');

    const areaPoints = `0,${h} ${points} ${w},${h}`;

    elevationSvg.innerHTML = `
      <polygon points="${areaPoints}" fill="${color}22" stroke="none"></polygon>
      <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"></polyline>
    `;

    const gain = gpxLayer.get_elevation_gain ? Math.round(gpxLayer.get_elevation_gain()) : null;
    const loss = gpxLayer.get_elevation_loss ? Math.round(gpxLayer.get_elevation_loss()) : null;
    elevationMeta.innerHTML = `
      <span>MIN <b>${Math.round(minE)} m</b></span>
      <span>MAX <b>${Math.round(maxE)} m</b></span>
      ${gain !== null ? `<span>&uarr; <b>${gain} m</b></span>` : ''}
      ${loss !== null ? `<span>&darr; <b>${loss} m</b></span>` : ''}
      <span>DIST <b>${distTotal.toFixed(1)} km</b></span>
    `;
  }
  elevationTitle.textContent = label;
  elevationPanel.classList.add('open');
}

fetch('tracks/manifest.json')
  .then(r => r.ok ? r.json() : [])
  .catch(() => [])
  .then(manifest => {
    if (!manifest || manifest.length === 0) {
      trackList.innerHTML = '<div class="note" style="margin:0 18px;">Keine Tracks (tracks/manifest.json fehlt oder leer).</div>';
      return;
    }

    manifest.forEach(entry => {
      const url = 'tracks/' + entry.file;
      const trackColor = entry.color || DEFAULT_TRACK_COLOR;
      const borderColor = entry.borderColor || "#12150f";
      const label = entry.label || entry.file;

      const row = document.createElement('div');
      row.className = 'layer-row on active';
      row.innerHTML = `
        <div class="checkbox"></div>
        <div class="swatch" style="background:${trackColor}"></div>
        <div class="layer-name">${label}</div>
        <span class="elev-btn" title="Hoehenprofil" style="cursor:pointer;padding:0 4px;color:var(--text-mute);">&#9968;</span>
        <div class="layer-count">...</div>
      `;
      trackList.appendChild(row);

      const gpxLayer = new L.GPX(url, {
        async: true,
        gpx_options: { parseElements: ['track', 'route'] }, // Waypoints (<wpt>) nicht mit einlesen
        polyline_options: { color: trackColor, weight: 3, opacity: 0.85 }
      });

      gpxLayer.on('loaded', (e) => {
        // Start-/End-Marker pro Track-Segment (Garmin splittet oft bei
        // Pausen in viele <trkseg>) rekursiv entfernen, nur die Linie bleibt.
        stripAllMarkers(e.target);
        makeTwoToneTrack(e.target, trackColor, borderColor, 3);
        const km = (e.target.get_distance() / 1000).toFixed(1);
        row.querySelector('.layer-count').textContent = km + ' km';
      });
      gpxLayer.on('error', () => {
        row.querySelector('.layer-count').textContent = '!';
        row.title = 'Datei nicht gefunden: ' + url;
      });

      gpxLayer.addTo(map);

      row.addEventListener('click', (ev) => {
        if (ev.target.classList.contains('elev-btn')) {
          renderElevationChart(gpxLayer, label, trackColor);
          return;
        }
        if (map.hasLayer(gpxLayer)) {
          map.removeLayer(gpxLayer);
          row.classList.remove('on', 'active');
        } else {
          map.addLayer(gpxLayer);
          row.classList.add('on', 'active');
        }
      });
    });
  });
</script>
